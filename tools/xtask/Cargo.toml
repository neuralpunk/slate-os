[package]
name = "xtask"
description = "Build, image, run and test tasks for Slate (cargo xtask)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fatfs = { version = "=0.3.6", default-features = false, features = ["std", "alloc"] }
slate-cpio = { path = "../../libs/cpio", features = ["alloc"] }
slate-gpt = { path = "../../libs/gpt" }
slate-hci = { path = "../../libs/hci", features = ["smp"] }
slate-fat = { path = "../../libs/fat" }
slate-esp = { path = "../../libs/esp" }
slate-qpkg = { path = "../../libs/qpkg" }
slate-elfsign = { path = "../../libs/elfsign" }
slate-hash = { path = "../../libs/hash" }
slate-dns = { path = "../../libs/dns" }
slate-pgp = { path = "../../libs/pgp" }

[lints]
workspace = true
