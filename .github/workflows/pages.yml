# SPDX-License-Identifier: MIT OR Apache-2.0
#
# The website (site/) on GitHub Pages: https://neuralpunk.github.io/slate-os/
# Deployed when site/ changes on main, once the repository is public
# (while it is private the job is skipped). In the repository's
# settings, Pages' source must be "GitHub Actions".

name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
