[package]
name = "slate-apps"
description = "Slate's own apps for Strata (M28, ADR 0104 and on): Calculator, Clock, Help, Image Viewer, Archive Manager, Text Editor, Files, Calendar, Contacts, System Monitor, Disks, Software Updater, and the Web Browser's first use"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "calculator"
path = "src/calculator_main.rs"
test = false
bench = false

