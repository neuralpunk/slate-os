[package]
name = "slate-hwtools"
description = "Slate's hardware listing tools: lspci and lsusb, from /sys (M23 phase 7)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "lspci"
path = "src/bin/lspci.rs"
test = false
bench = false

[[bin]]
name = "lsusb"
path = "src/bin/lsusb.rs"
test = false
bench = false

[dependencies]
slate-rt = { path = "../rt" }

[lints]
workspace = true
