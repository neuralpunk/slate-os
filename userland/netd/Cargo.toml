[package]
name = "slate-netd"
description = "netd, Slate's network daemon: DHCP and static addresses on every card, links coming and going, DNS settings (ADR 0048)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "netd"
path = "src/main.rs"
test = false
bench = false

[dependencies]
slate-rt = { path = "../rt" }
slate-net = { path = "../../libs/net" }
slate-dns = { path = "../../libs/dns" }
slate-netconf = { path = "../../libs/netconf" }

[lints]
workspace = true
