[package]
name = "slate-strata-wl"
description = "strata-wl, the bridge that shows a Linux runtime's Wayland programs in Strata (ADR 0038)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "strata-wl"
path = "src/main.rs"
test = false
bench = false

# A Wayland test client for the measurements and tests (M31 phase 1).
[[bin]]
name = "wl-probe"
path = "src/probe_main.rs"
test = false
bench = false

[dependencies]
slate-rt = { path = "../rt" }
slate-abi = { path = "../../libs/abi" }
slate-ui = { path = "../ui" }
slate-display = { path = "../display" }
slate-term = { path = "../../libs/term" }
slate-strata-client = { path = "../strata-client" }

[lints]
workspace = true
