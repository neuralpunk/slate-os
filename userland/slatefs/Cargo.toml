[package]
name = "slate-slatefs"
description = "slatefs: make, check and inspect SlateFS file systems (ADR 0026)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "slatefs"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "slate-update"
path = "src/bin/slate-update.rs"
test = false
bench = false

[dependencies]
slate-rt = { path = "../rt" }
slatefs = { path = "../../libs/slatefs" }
slatecrypt = { path = "../../libs/slatecrypt" }
slate-sync = { path = "../../libs/sync" }
slate-esp = { path = "../../libs/esp" }
slate-fat = { path = "../../libs/fat" }
slate-gpt = { path = "../../libs/gpt" }
slate-etcsync = { path = "../etcsync" }

[lints]
workspace = true
