[package]
name = "slate-sound"
description = "Slate's sound command: the sound cards, and the self-test tune Settings plays (M30, ADR 0184)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "slate-sound"
path = "src/bin/slate-sound.rs"
test = false
bench = false

[dependencies]
slate-rt = { path = "../rt" }
slate-alsa = { path = "../../libs/alsa" }
slate-math = { path = "../../libs/math" }

[lints]
workspace = true
