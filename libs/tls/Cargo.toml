[package]
name = "slate-tls"
description = "Slate's TLS 1.3 client (ADR 0053): the protocol and certificate checks ours, the primitives vetted crates"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
slate-hash = { path = "../hash" }
# Vetted cryptography (ADR 0012's exception, ADR 0053): key exchange,
# record protection and signature checks. Portable code throughout (the
# cfgs in .cargo/config.toml).
curve25519-dalek = { version = "=4.1.3", default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false }
chacha20 = { version = "=0.10.2", default-features = false, features = ["cipher"] }
poly1305 = { version = "=0.9.1", default-features = false }
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "ecdh"] }
p384 = { version = "=0.13.1", default-features = false, features = ["ecdsa", "ecdh"] }
rsa = { version = "=0.9.8", default-features = false, features = ["sha2"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }

[lints]
workspace = true
