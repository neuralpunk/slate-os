# The privilege broker's policy (ADR 0032): who may become whom with su,
# and run commands as whom with sudo (ADR 0058).
#
#   su FROM TO [nopassword | ownpassword]
#   run FROM TO[:GROUP] [nopassword | ownpassword] [COMMAND [ARGS...]]
#
# FROM is a user name, %group or *; TO a user name or *. Without a
# keyword su asks for TO's password (so an account without one can be
# become only with nopassword, ADR 0119); ownpassword asks for FROM's own.
# The first matching line decides, and without one su is refused. Root
# never asks the broker. Every decision is logged in
# /var/log/slate-security.log.

# Administrators (the wheel group) become root with their own password:
# systems the installer sets up have no root password (ADR 0035).
su %wheel root ownpassword

# Anyone who knows the target's password, as su always allowed.
su * *

# sudo (ADRs 0058, 0142, 0159): run lines take the same words, then
# tags, then the commands:
#
#   run FROM TO[:GROUP] [nopassword | ownpassword] [TAGS] [COMMAND, ...]
#
# A COMMAND is an absolute path (any arguments, or exactly the ARGS
# listed; "" for none), a directory ending in / (the commands in it),
# sudoedit and the files it may edit, or ALL; commas separate several.
# :GROUP (a name or *) is what sudo -g may choose; without it, only TO's
# own groups. FROM and TO may be lists without blanks (ann,bob). The
# TAGS: setenv (sudo -E may keep the environment), log_input and
# log_output (record the command's I/O for sudoreplay), nolog_input,
# nolog_output.
#
# Aliases name lists, in capitals, before the lines that use them:
#   commands NAME = COMMAND [ARGS], COMMAND [ARGS]...
#   users NAME = USER, %GROUP, ...
#
# defaults lines set sudo's options (sudoers' Defaults, by name):
# env_reset, env_keep (+= and -= add and remove names; NAME* matches a
# prefix), secure_path, setenv, timestamp_timeout (minutes), passwd_tries,
# log_input, log_output, use_pty, runcwd (* lets sudo -D choose the
# directory), user_command_timeouts (lets sudo -T set one); !NAME turns
# one off. For example:
#   commands UPDATES = /usr/bin/slate-update status, /usr/bin/slate-update commit
#   run ci root nopassword UPDATES
#   run %audio root sudoedit /etc/slate/sound
#   defaults env_keep += "EDITOR PAGER", log_output
# Administrators run commands as anyone with their own password,
# asked again after five minutes.
run %wheel *:* ownpassword
